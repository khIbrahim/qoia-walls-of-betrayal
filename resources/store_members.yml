# Store Members Configuration
# Configuration for store member management system

# Store member settings
store_members:
  # Default permissions for each role
  role_permissions:
    owner:
      - "store.manage.all"
      - "store.members.add"
      - "store.members.remove"
      - "store.members.promote"
      - "store.members.demote"
      - "store.finances.view"
      - "store.finances.manage"
      - "store.inventory.manage"
      - "store.settings.manage"
      - "store.reports.view"
      - "store.reports.generate"
    
    manager:
      - "store.members.add"
      - "store.members.remove"
      - "store.members.promote.limited"
      - "store.finances.view"
      - "store.inventory.manage"
      - "store.reports.view"
      - "store.members.view"
    
    supervisor:
      - "store.inventory.view"
      - "store.inventory.manage.limited"
      - "store.members.view"
      - "store.reports.view.limited"
      - "store.transactions.process"
    
    cashier:
      - "store.transactions.process"
      - "store.inventory.view"
      - "store.customers.serve"
      - "store.sales.record"
    
    employee:
      - "store.transactions.process"
      - "store.inventory.view.limited"
      - "store.customers.serve"
      - "store.sales.record"
    
    trainee:
      - "store.customers.serve"
      - "store.sales.record.supervised"

  # Commission rates by role (percentage of sales)
  commission_rates:
    owner: 50.0
    manager: 20.0
    supervisor: 15.0
    cashier: 10.0
    employee: 8.0
    trainee: 5.0

  # Session management settings
  sessions:
    # Auto clock out after inactivity (minutes)
    auto_clock_out_timeout: 30
    # Maximum session duration (hours)
    max_session_duration: 12
    # Minimum break between sessions (minutes)
    min_break_duration: 15

  # Performance tracking
  performance:
    # Enable automatic performance tracking
    enable_tracking: true
    # Track sales for commission calculation
    track_sales_for_commission: true
    # Minimum sales threshold for bonuses
    bonus_threshold: 1000.0
    # Performance review period (days)
    review_period: 30

  # Notifications
  notifications:
    # Notify on member join/leave
    notify_status_changes: true
    # Notify on promotions/demotions
    notify_role_changes: true
    # Notify on performance milestones
    notify_milestones: true

# Store management settings
store_settings:
  # Store hours (24-hour format)
  opening_hours:
    monday: "08:00-20:00"
    tuesday: "08:00-20:00"
    wednesday: "08:00-20:00"
    thursday: "08:00-20:00"
    friday: "08:00-22:00"
    saturday: "09:00-22:00"
    sunday: "10:00-18:00"
  
  # Store locations/branches
  locations:
    main:
      name: "Store Principal"
      description: "Magasin principal du serveur"
      coordinates: "spawn"
    
    # Additional stores can be added here
    # branch1:
    #   name: "Succursale Nord"
    #   description: "Succursale dans le quartier nord"
    #   coordinates: "1000, 64, 1000"

# Reporting configuration
reports:
  # Automatic report generation
  auto_generate:
    daily: true
    weekly: true
    monthly: true
  
  # Report formats
  formats:
    - "json"
    - "text"
  
  # Report recipients (for automatic distribution)
  recipients:
    daily: ["owner", "manager"]
    weekly: ["owner", "manager", "supervisor"]
    monthly: ["owner"]

# Integration settings
integration:
  # Enable shop transaction tracking
  track_shop_transactions: true
  # Enable economy integration
  economy_integration: true
  # Enable role synchronization with existing role system
  sync_with_roles_system: false